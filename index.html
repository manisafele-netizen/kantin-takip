<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="theme-color" content="#0a1017">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kantin Yemek Takibi</title>
<link rel="icon" id="ic">
<style>
:root{--bg:#0e141b;--card:#17212c;--tx:#e6ecf2;--mut:#8a9bad;--pri:#5b9bd5;--prit:#07111b;--red:#e5484d;--ok:#3fb27f;--ln:#243242;--sh:0 4px 14px #0004;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:112px;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#101a26;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,#101a26,#0a1017);padding:10px 16px 12px;border-bottom:2px solid var(--red);border-radius:0 0 22px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 22px #0006}
header img{height:56px;width:auto;display:block}header h1{margin:0;font-size:17px;line-height:1.2}header p{margin:2px 0 0;color:var(--mut);font-size:14px}
main{padding:14px 12px;max-width:560px;margin:auto}
button{font:inherit;border:0;border-radius:16px;padding:13px 14px;background:var(--pri);color:var(--prit);font-weight:700;transition:transform .12s,filter .12s;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.94);filter:brightness(.9)}
button.g{background:transparent;color:var(--pri);border:2px solid var(--pri)}button.r{background:var(--red);color:#fff}button.g:active{background:#5b9bd522}
button.rg{background:transparent;color:var(--red);border:2px solid var(--red)}button.sm{padding:8px 14px}
input{font:inherit;width:100%;padding:14px;border-radius:16px;border:2px solid var(--ln);background:var(--card);color:var(--tx);margin:4px 0 10px}
input:focus{outline:none;border-color:var(--pri)}
label{font-size:13px;color:var(--mut);font-weight:600}
.card{border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.btns{display:flex;gap:8px;margin:6px 0}.btns>*{flex:1}
.sub{color:var(--mut);font-size:14px}.nm{font-weight:700;font-size:17px}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;color:var(--mut);padding:10px}.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 5px #0002}
.rw{border-top:1px solid var(--ln);border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;border-left:6px solid var(--red);box-shadow:var(--sh);animation:in .25s}
.rw.ok{border-left-color:var(--ok)}.rw.te{border-left-color:var(--pri)}
.rw .r2{display:flex;align-items:center;gap:10px;margin-top:10px}
.stp{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:14px;padding:3px}
.stp button{width:40px;height:40px;padding:0;font-size:20px;background:var(--card);color:var(--pri);border-radius:12px}.stp b{min-width:24px;text-align:center}
.pb{flex:1;background:var(--red);color:#fff;padding:13px;font-size:16px}
.pb.on{color:#04180f;background:var(--ok);animation:pop .3s}
@keyframes pop{50%{transform:scale(1.07)}}
.pill{flex:1;text-align:center;color:var(--pri);font-weight:700}
.x{background:none;color:var(--mut);padding:4px 10px;font-size:18px}
.tag{font-size:11px;background:var(--red);color:#fff;border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.fab{display:flex;align-items:center;justify-content:center;line-height:0;position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;background:var(--red);color:#fff;padding:0;box-shadow:0 8px 20px #e5484d55;z-index:6}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;max-width:540px;margin:auto;display:flex;gap:2px;background:var(--card);border-radius:24px;padding:6px;box-shadow:0 8px 28px #0003;z-index:7}
nav button{flex:1;background:none;color:var(--mut);border-radius:18px;padding:8px 0 6px;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button.on{background:var(--pri);color:var(--prit)}
.sheet{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;animation:fd .2s}#dg{z-index:25;align-items:center;padding:16px}
.sheet[hidden]{display:none}
@keyframes fd{from{opacity:0}}
.pan{background:var(--bg);width:100%;max-width:560px;margin:auto;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s}#dg .pan{border-radius:24px}
@keyframes up{from{transform:translateY(60px)}}
.pan h3{margin:0}
.pr{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);color:var(--tx);margin-bottom:8px;text-align:left;font-size:17px;box-shadow:var(--sh)}
.pr small{color:var(--mut)}
.nw{background:var(--card);border-radius:16px;padding:10px;margin-bottom:8px;border:2px dashed var(--red)}
.big{font-size:38px;font-weight:800;color:var(--pri)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}.chips button{padding:10px 16px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.done{background:linear-gradient(135deg,#1b9a5a,#127a45);color:#fff;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(172px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2a3a4d;color:#fff;border-radius:16px;padding:10px 16px;z-index:30;display:flex;gap:14px;align-items:center;animation:in .2s;white-space:nowrap}
.toast button{background:none;color:#8cc4ff;padding:0}
details summary{color:var(--pri);font-weight:700;margin-top:8px}
.fin{width:100%;background:var(--ok);color:#04180f;padding:17px;font-size:17px;border-radius:18px;box-shadow:0 8px 20px #3fb27f40}
.mc{display:inline-flex;border:2px solid var(--pri);border-radius:14px;overflow:hidden}.mc button{background:none;color:var(--pri);border:0;border-radius:0;padding:9px 12px}.mc .mx{color:var(--mut);border-left:1px solid var(--ln);padding:9px 11px}
</style></head><body>

<script>
const K='kantin_v1';
let S={people:[],day:null,id:1,hist:[],walk:false},tab='liste',flt='all',M=[];
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.day&&S.day.done)S.day=null;
if(!Array.isArray(S.meals))S.meals=[...new Set(S.hist.map(h=>h.meal))];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const hp=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tl=n=>(Math.round(n*100)/100).toLocaleString('tr-TR',{maximumFractionDigits:2})+' ₺';
const P=id=>S.people.find(p=>p.id===id),isT=p=>p&&p.role==='Öğretmen';
const lc=s=>s.toLocaleLowerCase('tr'),byName=(a,b)=>a.name.localeCompare(b.name,'tr');
function toast(m,undo){const t=$('#ts');t.innerHTML=`<div class="toast">${m}${undo?'<button id="un">Geri al</button>':''}</div>`;if(undo)$('#un').onclick=()=>{undo();t.innerHTML=''};clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',3500)}
function stats(){const d=S.day,o=d.orders.filter(x=>P(x.pid)),st=o.filter(x=>!isT(P(x.pid))),te=o.filter(x=>isT(P(x.pid)));
 const sp=st.reduce((a,x)=>a+x.n,0),tp=te.reduce((a,x)=>a+x.n,0),need=sp*d.price,got=st.filter(x=>x.paid).reduce((a,x)=>a+x.n*d.price,0);return{st,te,sp,tp,need,got}}
const IC={gun:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M12 13v4M10 15h4"/>',liste:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',hesap:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',gecmis:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4M12 8v4l3 2"/>',kisi:'<circle cx="9" cy="8" r="4"/><path d="M2 20c0-4 3-6 7-6M17 10v6M14 13h6"/>'};
const ico=k=>`<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
function ask(m,yes,fn){const d=$('#dg');d.hidden=false;d.innerHTML=`<div class="pan"><h3>${m}</h3><div class="btns" style="margin-top:16px"><button class="g" onclick="$('#dg').hidden=true">Vazgeç</button><button class="r" onclick="$('#dg').hidden=true;const f=window._f;window._f=null;f&&f()">${yes}</button></div></div>`;window._f=fn}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
 $('#nv').innerHTML=[['gun','Yeni Gün'],['liste','Liste'],['hesap','Hesapla'],['gecmis','Geçmiş'],['kisi','Kişi ara/ekle']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${ico(k)}${n}</button>`).join('');
 const d=S.day;$('#hp').textContent=d?`${d.meal} · ${tl(d.price)}`:'Önce yeni gün açın';
 $('#fb').innerHTML=tab==='liste'&&d&&!d.done?'<button class="fab" onclick="openAdd(false)" aria-label="Ekle"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 4v22M4 15h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg></button>':'';
 $('#m').innerHTML={liste:vListe,kisi:vKisi,gun:vGun,hesap:vHesap,gecmis:vGecmis}[tab]();
 if(tab==='kisi')drawK();
}
function vListe(){
 if(!S.day)return `<div class="card" style="text-align:center;padding:28px 16px"><div class="nm" style="font-size:19px">Bugün için yemek günü yok</div><div class="sub" style="margin:6px 0 16px">Yemeğin adını ve fiyatını girerek başlayın.</div><button class="r" style="width:100%" onclick="go('gun')">Yeni yemek günü aç</button></div>`;
 const a=stats(),d=S.day;
 let o=d.orders.map((x,i)=>({x,i,p:P(x.pid)})).filter(r=>r.p);
 if(flt==='un')o=o.filter(r=>!isT(r.p)&&!r.x.paid);
 let h=`<div class="btns" style="margin-top:0"><button class="rg" onclick="openAdd(true)">＋ Sonradan gelen</button><button onclick="go('hesap')">Günü bitir ›</button></div>
 <div class="seg"><button class="${flt==='all'?'on':''}" onclick="flt='all';render()">Hepsi (${d.orders.length})</button><button class="${flt==='un'?'on':''}" onclick="flt='un';render()">Ödemeyen (${a.st.filter(x=>!x.paid).length})</button></div>`;
 if(!o.length)h+=`<div class="empty">${flt==='un'?'Ödemeyen kimse kalmadı 🎉':'Liste boş. + tuşuyla kişi ekleyin.'}</div>`;
 return h+o.map(({x,i,p})=>{const t=isT(p);
  return `<div class="rw ${t?'te':x.paid?'ok':''}"><div class="row"><div><span class="nm">${esc(p.name)}</span>${x.walk?'<span class="tag">sonradan</span>':''}<div class="sub">${t?'Öğretmen · ücretsiz':tl(x.n*d.price)}</div></div><button class="x" onclick="del(${i})">✕</button></div>
  <div class="r2"><div class="stp"><button onclick="qty(${i},-1)">−</button><b>${x.n}</b><button onclick="qty(${i},1)">+</button></div>
  ${t?'<span class="pill">Öğretmen</span>':`<button class="pb ${x.paid?'on':''}" onclick="pay(${i})">${x.paid?'✓ Ödendi':'Ödenmedi'}</button>`}</div></div>`}).join('');
}
function qty(i,v){const x=S.day.orders[i];x.n=Math.max(1,x.n+v);save();hp();render()}
function pay(i){const x=S.day.orders[i];x.paid=!x.paid;save();hp();render()}
function del(i){const x=S.day.orders.splice(i,1)[0];save();render();toast('Listeden çıkarıldı',()=>{S.day.orders.splice(i,0,x);save();render()})}
let aw=false;
function openAdd(w){aw=w;const sh=$('#sh');sh.hidden=false;sh.innerHTML=`<div class="pan"><div class="row"><h3>${w?'Sonradan gelen':'Listeye ekle'}</h3><button class="g sm" onclick="closeS()">Bitti</button></div><input id="sq" placeholder="Ara ya da yeni ad soyad yaz…" oninput="drawAl()" autocomplete="off"><div id="al"></div></div>`;drawAl();setTimeout(()=>$('#sq').focus(),60)}
function closeS(){$('#sh').hidden=true;render()}
function drawAl(){
 const q=$('#sq').value.trim(),ql=lc(q);
 const free=S.people.filter(p=>!S.day.orders.some(o=>o.pid===p.id)&&lc(p.name).includes(ql)).sort(byName);
 let h=free.map(p=>`<button class="pr" onclick="addO(${p.id})"><span>${esc(p.name)}</span><small>${p.role}</small></button>`).join('');
 if(q&&!S.people.some(p=>lc(p.name)===ql))h=`<div class="nw"><div class="sub">Kayıtlı değil: “${esc(q)}”</div><div class="btns"><button onclick="newO('Öğrenci')">+ Öğrenci</button><button class="g" onclick="newO('Öğretmen')">+ Öğretmen</button></div></div>`+h;
 $('#al').innerHTML=h||'<div class="empty">Herkes listede 🎉</div>';
}
function addO(id){S.day.orders.push({pid:id,n:1,paid:false,walk:aw});save();hp();$('#sq').value='';drawAl();$('#sq').focus();toast('✓ Eklendi')}
function newO(role){const n=$('#sq').value.trim();const id=S.id++;S.people.push({id,name:n,role});addO(id)}
function vKisi(){return `<div class="card"><b>Kişi ara ya da ekle</b><input id="kn" placeholder="Ad Soyad yaz…" oninput="drawK()" autocomplete="off"><div id="kl"></div></div>`}
function drawK(){
 const q=$('#kn').value.trim(),ql=lc(q),l=S.people.filter(p=>lc(p.name).includes(ql)).sort(byName);
 let h=q&&!S.people.some(p=>lc(p.name)===ql)?`<div class="nw"><div class="sub">Kayıtlı değil: “${esc(q)}”</div><div class="btns"><button onclick="addP('Öğrenci')">+ Öğrenci</button><button class="g" onclick="addP('Öğretmen')">+ Öğretmen</button></div></div>`:'';
 h+=l.map(p=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--ln)"><div><span class="nm">${esc(p.name)}</span><div class="sub">${p.role}</div></div><button class="x" onclick="delP(${p.id})">✕</button></div>`).join('');
 $('#kl').innerHTML=h||'<div class="empty">Kayıtlı kişi yok.</div>'}
function addP(r){const n=$('#kn').value.trim();if(!n)return;S.people.push({id:S.id++,name:n,role:r});save();hp();$('#kn').value='';drawK();toast('✓ Kaydedildi')}
function delP(id){ask('Kayıt silinsin mi?','Sil',()=>{S.people=S.people.filter(p=>p.id!==id);if(S.day)S.day.orders=S.day.orders.filter(o=>o.pid!==id);save();drawK()})}
function vGun(){
 const d=S.day;M=S.meals;
 const pr=[...new Set([150,200,...(d?[d.price]:[]),...S.hist.map(h=>h.price)])].filter(x=>x>0).slice(0,5);
 return `<div class="card"><b>Yeni yemek günü</b>
 <label>Yemeğin adı</label><input id="gm" placeholder="Örn. Kuru fasulye pilav">
 ${M.length?`<div class="chips">${M.map((m,i)=>`<span class="mc"><button onclick="pickM(${i})">${esc(m)}</button><button class="mx" onclick="delM(${i})" aria-label="Sil">✕</button></span>`).join('')}</div>`:''}
 <label>Porsiyon fiyatı (₺)</label><input id="gp" type="number" step="0.5" inputmode="decimal">
 <div class="chips">${pr.map(x=>`<button class="g" onclick="$('#gp').value=${x}">${x} ₺</button>`).join('')}</div>
 
 <button class="r" style="width:100%" onclick="newDay()">Günü aç</button></div>`;
}
function pickM(i){$('#gm').value=S.meals[i]}
function delM(i){const m=$('#gm').value,p=$('#gp').value;S.meals.splice(i,1);save();hp();render();$('#gm').value=m;$('#gp').value=p}
function newDay(){
 const m=$('#gm').value.trim(),p=parseFloat($('#gp').value);
 if(!m||!(p>=0)){toast('Yemek adı ve fiyatı girin');return}
  S.meals=[m,...S.meals.filter(x=>x!==m)].slice(0,30);if(S.day&&!S.day.done)archive();S.day={meal:m,price:p,orders:[],date:new Date().toLocaleDateString('tr-TR')};flt='all';save();hp();go('liste');
}
function endDay(){if(!S.day)return;const a=stats();ask(`Gün bitirilsin mi?<div class="sub" style="font-weight:400;margin-top:6px">Gereken ${tl(a.need)} · Ödenen ${tl(a.got)}<br>Liste geçmişe kaydedilir.</div>`,'Günü bitir',()=>{if(!S.day)return;archive();S.day=null;flt='all';save();hp();go('liste');toast('✓ Gün geçmişe kaydedildi')})}
function archive(){const d=S.day;if(!d||!d.orders.length)return;
 S.hist.unshift({date:d.date||'',meal:d.meal,price:d.price,rows:d.orders.filter(o=>P(o.pid)).map(o=>({name:P(o.pid).name,t:isT(P(o.pid)),n:o.n,paid:o.paid}))})}
function delH(i){ask('Bu gün kaydı silinsin mi?','Sil',()=>{S.hist.splice(i,1);save();render()})}
function vGecmis(){
 if(!S.hist.length)return '<div class="empty">Geçmiş kayıt yok.<br>Yeni gün açılınca önceki gün buraya kaydedilir.</div>';
 return S.hist.map((h,i)=>{const st=h.rows.filter(r=>!r.t),te=h.rows.filter(r=>r.t),sp=st.reduce((a,r)=>a+r.n,0),got=st.filter(r=>r.paid).reduce((a,r)=>a+r.n,0)*h.price,un=st.filter(r=>!r.paid);
 return `<div class="card"><div class="row"><div><span class="nm">${esc(h.meal)}</span><div class="sub">${esc(h.date)} · ${tl(h.price)}</div></div><button class="x" onclick="delH(${i})">✕</button></div>
 <div class="row" style="margin-top:6px"><span>Gereken</span><b>${tl(sp*h.price)}</b></div><div class="row"><span>Ödenen</span><b>${tl(got)}</b></div>
 <div class="row"><span>Ödemeyen</span><b style="color:var(--red)">${un.length} kişi · ${tl(sp*h.price-got)}</b></div>
 <div class="row"><span>Toplam porsiyon</span><b>${sp+te.reduce((a,r)=>a+r.n,0)} (öğretmen ${te.length})</b></div>
 <details><summary>Ayrıntı</summary>${h.rows.map(r=>`<div class="row sub" style="margin-top:4px"><span>${esc(r.name)}${r.t?' (öğretmen)':''}</span><span>${r.n} porsiyon${r.t?'':r.paid?' · ödedi':' · ödemedi'}</span></div>`).join('')}</details></div>`}).join('');
}
function vHesap(){
 const d=S.day;if(!d)return '<div class="empty">Önce yemek günü açın.</div>';
 const a=stats(),un=a.st.filter(o=>!o.paid);
 return `<div class="card"><div class="sub">Kasaya gelmesi gereken</div><div class="big">${tl(a.need)}</div><div class="sub">${a.sp} öğrenci porsiyonu × ${tl(d.price)}</div></div>
 <div class="card"><div class="row"><span>Şu ana kadar ödenen</span><b style="color:var(--ok)">${tl(a.got)}</b></div><div class="row"><span>Eksik kalan</span><b style="color:var(--red)">${tl(a.need-a.got)}</b></div></div>
 <div class="card"><div class="row"><span>Toplam sipariş (porsiyon)</span><b>${a.sp+a.tp}</b></div><div class="row"><span>Öğrenci</span><b>${a.st.length} kişi · ${a.sp} porsiyon</b></div><div class="row"><span>Öğretmen</span><b>${a.te.length} kişi · ${a.tp} porsiyon</b></div></div>
 <div class="card"><b>Ödemeyenler (${un.length})</b>${un.length?un.map(o=>`<div class="row" style="margin-top:8px"><span>${esc(P(o.pid).name)}</span><span style="color:var(--red)">${o.n} × ${tl(d.price)} = ${tl(o.n*d.price)}</span></div>`).join(''):'<div class="sub">Herkes ödedi 🎉</div>'}</div>
 <div class="sub" style="text-align:center;margin:4px 0 10px">Tutarları kontrol edin, sonra günü bitirin.</div>
 <button class="fin" onclick="endDay()">✓ Günü bitir ve geçmişe kaydet</button>`;
}
render();
try{$("#ic").href=document.querySelector("header img").src}catch(e){}
</script></body></html>
